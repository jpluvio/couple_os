2"><div style="margin-bottom: 20px;"><div style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #a8562e; margin-bottom: 2px;">{{ s.nome }}</div><sc-for list="{{ s.righe }}" as="r" hint-placeholder-count="3"><div onClick="{{ r.consuma }}" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f5efe6; cursor: pointer; opacity: {{ r.opacita }};"><div style="flex-grow: 1; font-size: 15px; text-decoration: {{ r.strike }};">{{ r.nome }}</div><div style="font-size: 13.5px; color: #8a7f74;">{{ r.qta }}</div><div style="padding: 3px 9px; border-radius: 2px; background: {{ r.badgeBg }}; font-size: 11px; font-weight: 600; color: {{ r.badgeColore }}; white-space: nowrap;">{{ r.badge }}</div></div></sc-for></div></sc-for></div><div style="flex-grow: 1;"></div><div style="border-top: 1px solid #ece4d9; background: #fffdfa; padding: 12px 16px 30px 16px; display: flex; justify-content: space-between;"><div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a49a8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg><div style="font-size: 10.5px; font-weight: 400; color: #a49a8e;">Oggi</div></div><div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a49a8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4M18 2v4M3 9h18M5 5h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg><div style="font-size: 10.5px; font-weight: 400; color: #a49a8e;">Agenda</div></div><div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1a1714" stroke-width="1.6" stroke-linecap="round" <script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { finiti: {} }; }
  renderVals() {
    const dati = [
      { nome: "Frigo", righe: [
        { nome: "Yogurt greco",    qta: "4 vasetti", badge: "Domani",   colore: "#c2410c", urgente: true },
        { nome: "Latte intero",    qta: "1 l",       badge: "Scaduto",  colore: "#b91c1c", urgente: true },
        { nome: "Uova",            qta: "6",         badge: "5 giorni", colore: "#8a7f74", urgente: false },
        { nome: "Ricotta salata",  qta: "200 g",     badge: "",         colore: "",        urgente: false }
      ]},
      { nome: "Dispensa", righe: [
        { nome: "Pomodori pelati", qta: "3 lattine", badge: "", colore: "", urgente: false },
        { nome: "Pasta rigatoni",  qta: "500 g",     badge: "", colore: "", urgente: false },
        { nome: "Sedano rapa",     qta: "1",         badge: "", colore: "", urgente: false }
      ]}
    ];
    let urgenti = 0;
    const sezioni = dati.map((sez, si) => ({
      nome: sez.nome,
      righe: sez.righe.map((r, ri) => {
        const chiave = si + "-" + ri;
        const finito = this.state.finiti[chiave] === true;
        if (r.urgente && !finito) urgenti++;
        return {
          nome: r.nome, qta: r.qta,
          badge: finito ? "finito" : r.badge,
          badgeBg: finito ? "#f5efe6" : (r.badge ? r.colore + "18" : "transparent"),
          badgeColore: finito ? "#a49a8e" : (r.badge ? r.colore : "transparent"),
          strike: finito ? "line-through" : "none",
          opacita: finito ? "0.45" : "1",
          consuma: () => {
            const next = Object.assign({}, this.state.finiti);
            next[chiave] = !next[chiave];
            this.setState({ finiti: next });
          }
        };
      })
    }));
    return {
      sezioni: sezioni,
      inScadenza: urgenti > 0,
      avviso: urgenti === 1 ? "1 prodotto scade entro domani" : urgenti + " prodotti scadono entro domani"
    };
  }
}
</script>
