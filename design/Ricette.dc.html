<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #a8562e; } a:hover { color: #7d3e20; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf7f2; font-family: 'Public Sans', system-ui, sans-serif; color: #1a1714; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 56px 24px 18px 24px;">
    <div style="font-family: 'Newsreader', Georgia, serif; font-size: 32px; line-height: 1.08;">Ricette</div>
  </div>

  <div style="margin: 0 24px 16px 24px; display: flex; gap: 7px;">
    <div style="padding: 8px 15px; background: #ffffff; border: 1px solid #ece4d9; color: #8a7f74; border-radius: 2px; font-size: 13px;">Dispensa</div>
    <div style="padding: 8px 15px; background: #ffffff; border: 1px solid #ece4d9; color: #8a7f74; border-radius: 2px; font-size: 13px;">Spesa</div>
    <div style="padding: 8px 15px; background: #1a1714; color: #faf7f2; border-radius: 2px; font-size: 13px; font-weight: 500;">Ricette</div>
  </div>

  <div style="margin: 0 24px 12px 24px; padding: 18px 20px; background: #ffffff; border: 1px solid #ece4d9; border-radius: 4px;">

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Newsreader', Georgia, serif; font-size: 23px; line-height: 1.1;">Pasta alla Norma</div>
      <div style="font-size: 13px; color: #8a7f74;">Ricetta base per 2 persone</div>
    </div>

    <!-- Selettore porzioni -->
    <div style="display: flex; align-items: center; justify-content: space-between; background: #faf7f2; border: 1px solid #ece4d9; border-radius: 3px; padding: 10px 12px; margin: 16px 0 4px 0;">
      <div style="font-size: 14px; color: #8a7f74;">Porzioni</div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div onClick="{{ meno }}" style="width: 32px; height: 32px; border-radius: 16px; background: #ffffff; border: 1px solid #ece4d9; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8562e" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </div>
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; min-width: 24px; text-align: center;">{{ porzioni }}</div>
        <div onClick="{{ piu }}" style="width: 32px; height: 32px; border-radius: 16px; background: #a8562e; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <div style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #a8562e; margin: 16px 0 2px 0;">{{ titoloIngredienti }}</div>

    <sc-for list="{{ ingredienti }}" as="ing" hint-placeholder-count="5">
      <div onClick="{{ ing.toggle }}" style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f5efe6; cursor: pointer;">
        <div style="font-family: {{ ing.qtyFont }}; font-size: {{ ing.qtySize }}; font-weight: 500; width: 62px; color: {{ ing.qtyColor }};">{{ ing.qtyLabel }}</div>
        <div style="font-size: 14.5px; flex-grow: 1; color: {{ ing.nameColor }}; text-decoration: {{ ing.strike }};">{{ ing.name }}</div>
        <div style="padding: 3px 9px; border-radius: 2px; background: {{ ing.badgeBg }}; font-size: 11px; font-weight: 600; color: {{ ing.badgeColor }}; white-space: nowrap;">{{ ing.badge }}</div>
      </div>
    </sc-for>

    <!-- Azione -->
    <div onClick="{{ aggiungi }}" style="display: flex; align-items: center; justify-content: center; gap: 9px; background: {{ bottoneBg }}; border-radius: 2px; padding: 14px; margin-top: 18px; cursor: pointer;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#faf7f2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21 7H6"/></svg>
      <div style="font-size: 14.5px; font-weight: 500; color: #faf7f2;">{{ bottoneTesto }}</div>
    </div>

    <div style="font-size: 12px; color: #a49a8e; text-align: center; line-height: 1.5; margin-top: 10px; white-space: pre-line;">{{ nota }}</div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="border-top: 1px solid #ece4d9; background: #fffdfa; padding: 12px 16px 30px 16px; display: flex; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a49a8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <div style="font-size: 10.5px; color: #a49a8e;">Oggi</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a49a8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4M18 2v4M3 9h18M5 5h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
      <div style="font-size: 10.5px; color: #a49a8e;">Agenda</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1a1714" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <div style="font-size: 10.5px; font-weight: 600;">Casa</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a49a8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <div style="font-size: 10.5px; color: #a49a8e;">Soldi</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a49a8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <div style="font-size: 10.5px; color: #a49a8e;">Noi</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // porzioni della ricetta base; escluse = righe tolte a mano dalla lista
    this.state = { porzioni: 4, escluse: {}, aggiunto: false };
  }

  base() { return 2; }

  righe() {
    // qty null = non scalabile (q.b.). unit "" = pezzi interi.
    return [
      { name: "Sedano rapa",     qty: 200, unit: "g", inDispensa: true  },
      { name: "Melanzane",       qty: 1,   unit: "",  inDispensa: false },
      { name: "Pomodori pelati", qty: 250, unit: "g", inDispensa: true  },
      { name: "Ricotta salata",  qty: 80,  unit: "g", inDispensa: false },
      { name: "Basilico",        qty: null, unit: "", inDispensa: false }
    ];
  }

  // Arrotondamento: i pezzi non si dividono, i pesi si arrotondano
  // a passi leggibili invece di lasciare 133,33 g.
  arrotonda(v, unit) {
    if (unit === "") return Math.ceil(v);
    if (v >= 100) return Math.round(v / 10) * 10;
    if (v >= 10) return Math.round(v / 5) * 5;
    return Math.round(v * 2) / 2;
  }

  renderVals() {
    const porzioni = this.state.porzioni;
    const fattore = porzioni / this.base();
    const escluse = this.state.escluse;

    let daAggiungere = 0;
    let inDispensaCount = 0;

    const ingredienti = this.righe().map((r, i) => {
      const scartata = escluse[i] === true;
      const nonScalabile = r.qty === null;
      const saltata = r.inDispensa || scartata;

      if (!saltata && !nonScalabile) daAggiungere++;
      if (r.inDispensa && !scartata) inDispensaCount++;

      let qtyLabel;
      if (nonScalabile) {
        qtyLabel = "q.b.";
      } else {
        const v = this.arrotonda(r.qty * fattore, r.unit);
        qtyLabel = r.unit ? v + " " + r.unit : String(v);
      }

      let badge = "", badgeBg = "transparent", badgeColor = "transparent";
      if (nonScalabile) {
        badge = "non scalato"; badgeBg = "transparent"; badgeColor = "#a49a8e";
      } else if (r.inDispensa && !scartata) {
        badge = "in dispensa"; badgeBg = "#16653418"; badgeColor = "#166534";
      } else if (scartata) {
        badge = "esclusa"; badgeBg = "#f5efe6"; badgeColor = "#a49a8e";
      }

      return {
        name: r.name,
        qtyLabel: qtyLabel,
        qtyFont: nonScalabile ? "'Public Sans', sans-serif" : "'Newsreader', Georgia, serif",
        qtySize: nonScalabile ? "13px" : "15px",
        qtyColor: saltata || nonScalabile ? "#a49a8e" : "#a8562e",
        nameColor: saltata || nonScalabile ? "#8a7f74" : "#1a1714",
        strike: scartata ? "line-through" : "none",
        badge: badge,
        badgeBg: badgeBg,
        badgeColor: badgeColor,
        toggle: () => {
          const next = Object.assign({}, this.state.escluse);
          next[i] = !next[i];
          this.setState({ escluse: next, aggiunto: false });
        }
      };
    });

    let nota;
    if (this.state.aggiunto) {
      nota = "Aggiunti alla lista. Le quantità si sono sommate a quelle già presenti.";
    } else if (inDispensaCount > 0) {
      nota = inDispensaCount + " ingredienti li hai già in dispensa: restano fuori.\nTocca una riga per escluderla o rimetterla.";
    } else {
      nota = "Tocca una riga per escluderla dalla lista.";
    }

    return {
      porzioni: porzioni,
      titoloIngredienti: "Ingredienti · ricalcolati per " + porzioni,
      ingredienti: ingredienti,
      bottoneTesto: this.state.aggiunto
        ? "Aggiunti alla lista"
        : "Aggiungi " + daAggiungere + " alla lista",
      bottoneBg: this.state.aggiunto ? "#166534" : "#1a1714",
      nota: nota,
      piu: () => this.setState({ porzioni: Math.min(this.state.porzioni + 1, 12), aggiunto: false }),
      meno: () => this.setState({ porzioni: Math.max(this.state.porzioni - 1, 1), aggiunto: false })
    };
  }
}
</script>
</body>
</html>
